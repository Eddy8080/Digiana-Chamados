{% extends 'base.html' %}
{% load static %}

{% block title %}Entrar - Digiana{% endblock %}

{% block main_class %}login-main{% endblock %}

{% block extra_head %}
<style>
    /* Trava o layout em 100vh — sem barras de rolagem, footer visível */
    html, body { height: 100vh !important; overflow: hidden !important; }

    .login-main {
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        min-height: 0 !important;   /* permite flex-grow encolher corretamente */
    }

    .login-shell {
        /* header: 4rem | footer: py-6 (3rem) + 2 linhas texto ≈ 2.75rem = 5.75rem */
        --login-available-height: calc(100vh - 4rem - 5.75rem);
        --login-banner-width: min(42vw, 520px);
        margin-left: calc(50% - 50vw);
        margin-right: calc(50% - 50vw);
        width: 100vw;
    }

    .login-banner-panel {
        bottom: 5.75rem;  /* alinha com o topo do footer */
        height: auto;
        position: fixed;
        right: 0;
        top: 4rem;
        width: var(--login-banner-width);
        z-index: 5;
    }

    .login-card {
        position: relative;
        z-index: 10;
    }

    .theme-banner-light {
        display: none;
    }

    html.light-mode .theme-banner-dark {
        display: none;
    }

    html.light-mode .theme-banner-light {
        display: block;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-shell flex h-[var(--login-available-height)] items-center">
    <div class="grid h-[var(--login-available-height)] w-full items-center gap-8 px-4 sm:px-6 lg:grid-cols-[minmax(1rem,1fr)_minmax(340px,448px)_minmax(1rem,1fr)] lg:pr-[var(--login-banner-width)]">
        <div class="hidden lg:block"></div>
        <div class="login-card w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
            <div class="login-logo-text"><span class="ia-glow">Login</span></div>

            <form method="POST" class="space-y-5">
                {% csrf_token %}
                {% for field in form %}
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type|default:'text' }}"
                           name="{{ field.html_name }}"
                           id="{{ field.id_for_label }}"
                           class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition"
                           {% if field.field.widget.input_type == 'password' %}autocomplete="off"{% endif %}
                           required>
                </div>
                {% endfor %}

                <button type="submit" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-xl shadow-lg transition">
                    Acessar Conta
                </button>
            </form>


        </div>

        <div class="hidden lg:block"></div>
    </div>

    <section class="login-banner-panel hidden items-stretch justify-end overflow-hidden lg:flex">
        <img src="{% static 'img/Dark.png' %}"
             alt="Banner Digiana"
             class="theme-banner theme-banner-dark h-full w-auto max-w-full object-contain object-right">
        <img src="{% static 'img/Light.png' %}"
             alt="Banner Digiana"
             class="theme-banner theme-banner-light hidden h-full w-auto max-w-full object-contain object-right">
    </section>
</div>
{% endblock %}
