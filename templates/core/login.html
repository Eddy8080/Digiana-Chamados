{% extends 'base.html' %}

{% block title %}Entrar - Digiana{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-[60vh]">
    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
        <div class="login-logo-text">Dig<span class="ia-glow">IA</span>na</div>

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">{{ field.label }}</label>
                <input type="{{ field.field.widget.input_type|default:'text' }}" 
                       name="{{ field.html_name }}"
                       id="{{ field.id_for_label }}"
                       class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition"
                       required>
            </div>
            {% endfor %}

            <button type="submit" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-xl shadow-lg transition">
                Acessar Conta
            </button>
        </form>


    </div>
</div>
{% endblock %}
