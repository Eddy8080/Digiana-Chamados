{% extends 'base.html' %}

{% block title %}{{ title }} - Digiana{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
        <h2 class="text-2xl font-bold text-slate-800 mb-6">{{ title }}</h2>

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <p class="text-xs text-rose-500 mt-1">{{ field.errors.as_text }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                <a href="{% url 'dashboard' %}" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition">
                    Cancelar
                </a>
                <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/10 transition">
                    Salvar Registro
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
